services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount artifacts for easy iteration; for production you can bake them in instead
      - ./artifacts:/app/artifacts

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api